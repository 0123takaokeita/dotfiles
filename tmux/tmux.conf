# Vimスタイルの移動キーバインディング
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vimスタイルのペイン分割キーバインディング
bind \' split-window -v
bind \" split-window -h

# Vimスタイルのペインサイズ変更キーバインディング
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vimスタイルのウィンドウスイッチング
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# copy modeの設定
setw -g mode-keys vi

# claude code の改行問題の対策
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# mouse スクロールOn
set -g mouse on

# ステータスバー（下メニュー）: window一覧 / pane一覧 / session一覧の3行構成
# nightfox配色に統一し、各行の「今フォーカスしている項目」を別アクセント色にして見分けやすくする
# （window=青, pane=緑, session=橙。bgは #192330 で他のnightfox設定と統一）
set -g status 3
set -g status-style "bg=#192330,fg=#71839b"

set -g status-left-style "fg=#719cd6,bold"
set -g status-left " #S "
set -g status-left-length 20
set -g status-right-style "fg=#71839b"
set -g status-right " %H:%M %d-%b "
set -g status-right-length 20
set -g status-justify left

set -g window-status-style "fg=#71839b"
set -g window-status-current-style "fg=#192330,bg=#719cd6,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

# pane一覧はフルパスだと長くなるので実行中コマンド名だけ表示
# claude codeはNode.jsのprocess.titleでargv0をバージョン番号(例: 2.1.223)に書き換えるため、
# N.N.N形式に見えたら claude 表記に戻す
set -g pane-status-style "fg=#71839b"
set -g pane-status-current-style "fg=#192330,bg=#81b29a,bold"
set -g window-pane-status-format " #{pane_index}:#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}} "
set -g window-pane-current-status-format " #{pane_index}:#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}} "

set -g session-status-style "fg=#71839b"
set -g session-status-current-style "fg=#192330,bg=#f4a261,bold"

# 非アクティブペインを白っぽくフェード（Webの非アクティブ表示風。nightfox bg #192330 に白を約1割ブレンド）
# window-style 方式だとアクティブ側にも色の明示が必要になる（tmux 3.2+ の継承仕様）ため、
# フックで「フォーカスを失ったペインにだけ塗る・得たら解除」にして、アクティブは無着色を保つ
set -g focus-events on
set-hook -g pane-focus-in "select-pane -P default"
set-hook -g pane-focus-out "select-pane -P bg=#303945"
